<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>展会项目看板 V1.4.4</title>
<style>
:root{--blue:#2563eb;--blue-2:#3f8cff;--grad-blue:linear-gradient(135deg,#2563eb,#38bdf8);--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--ink:#10233f;--muted:#64748b;--line:#e6edf7;--bg:#eef4fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* ===== 侧边栏 ===== */
.sidebar{width:200px;flex:0 0 200px;min-height:100vh;position:sticky;top:0;background:linear-gradient(180deg,#0c1e42 0%,#122c5e 55%,#16356f 100%);border-right:0;box-shadow:4px 0 20px rgba(12,30,66,.14);z-index:5}
.brand{height:72px;display:flex;align-items:center;gap:11px;padding:0 20px;color:#fff;font-size:22px;font-weight:800;letter-spacing:.5px}
.brandLogo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#22d3ee);display:flex;align-items:center;justify-content:center;flex:0 0 36px;box-shadow:0 4px 14px rgba(59,130,246,.5)}
.brandLogo svg{width:20px;height:20px}
.nav{padding:8px 12px}.nav a{display:block;padding:13px 14px;color:#b7c8e8;text-decoration:none;border-radius:10px;margin-bottom:5px;font-size:14px;font-weight:500;transition:all .2s;position:relative}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(3px)}
.nav a.active{background:linear-gradient(90deg,#2563eb,#3f7bf6);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.42)}
.nav a.active::after{content:"";position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:4px 0 0 4px;background:#fff}
.sidefoot{position:absolute;bottom:22px;left:20px;font-size:11px;color:#8fa6cc;line-height:1.8}
.sidefoot b{color:#dbe7ff}
/* ===== 主区 ===== */
.main{flex:1;min-width:0;padding:18px 20px 30px;background:linear-gradient(165deg,#e9f1fb 0%,#f6faff 48%,#eef5fd 100%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.title{font-size:30px;font-weight:800;letter-spacing:.5px;background:linear-gradient(120deg,#0f2a5c,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{font-size:12px;color:#66778e;margin-left:12px;font-weight:400}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.segment{display:flex;border:1px solid #d7e4f2;background:#eaf1fa;border-radius:11px;padding:3px;overflow:hidden}
.segment button{border:0;padding:7px 15px;background:transparent;color:#48618c;cursor:pointer;font-size:13px;border-radius:8px;font-family:inherit;transition:all .18s;font-weight:500}
.segment button.active{background:var(--grad-blue);color:#fff;box-shadow:0 3px 9px rgba(37,99,235,.38)}
.arrow{width:36px;height:36px;border:1px solid #d7e4f2;border-radius:11px;background:#fff;color:#2563eb;cursor:pointer;font-size:17px;transition:all .18s;box-shadow:0 2px 6px rgba(15,30,61,.06);line-height:1}
.arrow:hover{background:var(--grad-blue);color:#fff;border-color:transparent;transform:translateY(-1px);box-shadow:0 5px 12px rgba(37,99,235,.35)}
.period{min-width:162px;text-align:center;background:#fff;border:1px solid #d7e4f2;border-radius:12px;padding:6px 14px;box-shadow:0 2px 6px rgba(15,30,61,.06)}
.period b{font-size:14px;color:#16294d}
.period div{font-size:10px;color:#718198;margin-top:1px}
.source{border:1px solid #bcd4f7;background:linear-gradient(135deg,#fff,#f0f7ff);color:#1d4ed8;padding:9px 15px;border-radius:10px;font-size:13px;cursor:pointer;transition:all .18s;font-family:inherit;font-weight:500}
.source:hover{background:var(--grad-blue);color:#fff;border-color:transparent;box-shadow:0 5px 12px rgba(37,99,235,.35)}
/* ===== KPI ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;min-height:116px;box-shadow:0 6px 16px rgba(20,60,100,.05);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,60,100,.11)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.kpi:nth-child(1)::before{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.kpi:nth-child(2)::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.kpi:nth-child(3)::before{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.kpi:nth-child(4)::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpiTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kpiIcon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px}
.kpiIcon svg{width:19px;height:19px}
.kpiIcon.i1{background:linear-gradient(135deg,#2563eb,#60a5fa);box-shadow:0 4px 10px rgba(37,99,235,.32)}
.kpiIcon.i2{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 4px 10px rgba(245,158,11,.32)}
.kpiIcon.i3{background:linear-gradient(135deg,#8b5cf6,#a78bfa);box-shadow:0 4px 10px rgba(139,92,246,.32)}
.kpiIcon.i4{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 4px 10px rgba(16,185,129,.32)}
.kpi .label{font-size:13px;color:#5b6b84;font-weight:600}
.kpi .value{font-size:35px;font-weight:800;margin:2px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
.kpi .delta{display:inline-block;background:#f1f5f9;border-radius:20px;padding:3px 11px;font-size:11px;color:#64748b;font-weight:500}
/* ===== 三卡片 ===== */
.three{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0;box-shadow:0 6px 16px rgba(20,60,100,.05);transition:box-shadow .2s}
.card:hover{box-shadow:0 10px 24px rgba(20,60,100,.09)}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700;color:#16294d;display:flex;align-items:center;gap:9px}
.card h3::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,#2563eb,#38bdf8)}
svg{width:100%;height:auto;display:block}
.statusWrap{display:flex;align-items:center;justify-content:center;gap:26px;min-height:196px}
.ring{width:128px;height:128px;border-radius:50%;position:relative;box-shadow:0 10px 26px rgba(20,60,100,.13),inset 0 0 0 1px rgba(20,60,100,.04)}
.ring:after{content:"";position:absolute;inset:30px;background:#fff;border-radius:50%;box-shadow:inset 0 2px 10px rgba(20,60,100,.07)}
.ringCenter{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.ringCenter b{font-size:28px;color:#16294d;font-variant-numeric:tabular-nums}
.ringCenter span{font-size:11px;color:#7a8aa5;margin-top:2px;font-weight:500}
.legend{min-width:112px}
.legend div{font-size:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#3d5068}
.legend b{font-size:15px;color:#16294d;font-variant-numeric:tabular-nums}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:7px}
.barRow{display:grid;grid-template-columns:132px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:11px;color:#3d5068}
.barBg{height:10px;background:#eef3f9;border-radius:8px;overflow:hidden}
.barFill{height:100%;border-radius:8px;background:linear-gradient(90deg,#60a5fa,#2563eb);box-shadow:0 2px 5px rgba(37,99,235,.25)}
.barRow b{font-size:13px;color:#16294d;text-align:right;font-variant-numeric:tabular-nums}
/* ===== 甘特图 ===== */
.ganttCard{padding-bottom:16px}
.ganttWrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
.ganttWrap::-webkit-scrollbar{height:8px;width:8px}
.ganttWrap::-webkit-scrollbar-thumb{background:#c3d3e8;border-radius:8px}
.ganttWrap::-webkit-scrollbar-track{background:#f1f6fc}
.gantt{width:100%;border-collapse:collapse;font-size:11px;min-width:1180px}
.gantt th{background:#f1f6fc;padding:8px;text-align:left;color:#33476a;font-weight:600;border-bottom:2px solid #e3ecf6;white-space:nowrap}
.gantt thead tr:first-child th:not(.monthHead){background:linear-gradient(180deg,#1d3a6e,#24509c);color:#fff;border-bottom:2px solid #1d3a6e;font-weight:600}
.gantt .monthHead{background:linear-gradient(180deg,#eaf3ff,#dcebfe);color:#1d4ed8;font-weight:700;text-align:center;font-size:11.5px;letter-spacing:.4px}
.gantt td{border-bottom:1px solid #eef3f9;padding:8px;white-space:nowrap;transition:background .15s}
.gantt tbody tr:nth-child(even) td{background:#fafcff}
.gantt tbody tr:hover td{background:#f2f8ff}
.gantt .date{font-variant-numeric:tabular-nums}
.tcell{min-width:530px}
.timeline{position:relative;height:30px;background:repeating-linear-gradient(90deg,#fff 0,#fff 44px,#eef3f9 45px,#fff 46px);border-radius:7px;border:1px solid #eef3f9;overflow:visible}
.bar{position:absolute;top:6px;height:18px;border-radius:6px;color:#fff;font-size:10px;line-height:18px;text-align:center;overflow:hidden;font-weight:600;letter-spacing:.3px;box-shadow:0 2px 5px rgba(15,30,61,.2)}
.bar.prep{background:linear-gradient(90deg,#94a3b8,#b8c5d6)}
.bar.run{background:linear-gradient(90deg,#2563eb,#3f8cff)}
.bar.done{background:linear-gradient(90deg,#0ea371,#2dd4a0)}
.bar.cancel{background:linear-gradient(90deg,#e5484d,#f87171)}
.today{position:absolute;top:0;bottom:0;width:0;background:transparent;border-left:1px dashed #ef4444;z-index:2;box-shadow:none}
.todayLabel{position:absolute;top:-14px;left:0;color:#ef4444;font-size:9px;font-weight:700;transform:translateX(-50%);background:#fff;padding:0 3px;border-radius:4px;border:1px solid #fcd3d3}
/* ===== 日历表头 ===== */
.calendar{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;padding:3px 2px;min-width:600px}
.calDay{background:#f3f7fc;border:1px solid #e5edf7;border-radius:6px;padding:4px 0;text-align:center;line-height:1.25}
.calDay b{display:block;font-size:10.5px;color:#1e3a5f;font-variant-numeric:tabular-nums;font-weight:600}
.calDay span{font-size:9px;color:#8a9bbd}
.calDay.calToday{background:linear-gradient(180deg,#2563eb,#1d4ed8);border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.4)}
.calDay.calToday b,.calDay.calToday span{color:#fff;font-weight:600}
.note{font-size:10px;color:#7a899d;margin-top:7px}
@media(max-width:1180px){.sidebar{width:160px;flex-basis:160px}.kpis{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}}
@media(max-width:720px){.kpis{grid-template-columns:1fr}}

/* ===== V1.4.1 stability patch: calendar/timeline only ===== */
.gantt{min-width:1320px}
.gantt th:last-child,.gantt td:last-child{min-width:650px}
.gantt .monthHead{min-width:650px}
.calendar{min-width:650px!important}
.timeline{min-width:650px}

</style>

<style id="outer-shell-patch">
.side,.sidebar{display:none!important}
.app{display:block!important;width:100%!important;max-width:100%!important}
.main{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important}
html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
</style>

</head>

  </section>

  <section class="three">

    <div class="card"><h3>展会状态分布</h3><div class="statusWrap"><div class="ring" id="statusRing"><div class="ringCenter"><b id="ringTotal">0</b><span>展会总数</span></div></div><div class="legend" id="statusLegend"></div></div></div>
    <div class="card"><h3>展示产品</h3><div id="products"></div><div class="note">按当前统计周期内涉及的需求机器统计。</div></div>
  </section>

  <section class="card ganttCard">
    <h3>
      <span>展会进度安排</span>
      <span id="ganttPeriodText" style="font-size:11px;font-weight:500;color:#65768d"></span><span style="font-size:10px;color:#94a3b8">（项目列表按当前筛选周期）</span>
    </h3>
    <div class="ganttWrap">
      <table class="gantt">
        <thead>
<tr>
  <th rowspan="2">展会项目</th>
  <th rowspan="2">地点</th>
  <th rowspan="2">状态</th>
  <th rowspan="2">开始日期</th>
  <th rowspan="2">结束日期</th>
  <th rowspan="2">持续天数</th>
  <th id="calendarMonthHeader" class="monthHead"></th>
</tr>
<tr>
  <th id="calendarHeader" style="padding:0"></th>
</tr>
</thead>
        <tbody id="ganttBody"></tbody>
      </table>
    </div>
  </section>
</main>
</div>

function D(s){return new Date(s+'T00:00:00')}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){let x=new Date(d),k=(x.getDay()+6)%7;return add(x,-k)}
function bounds(a,m){let s,e,label,sub='';if(m==='day'){s=new Date(a);e=new Date(a);label=`${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`}if(m==='week'){s=monday(a);e=add(s,6);let jan4=new Date(s.getFullYear(),0,4),w=Math.floor((s-monday(jan4))/604800000)+1;label=`${s.getFullYear()}年 第${w}周`;sub=`${String(s.getMonth()+1).padStart(2,'0')}/${String(s.getDate()).padStart(2,'0')} - ${String(e.getMonth()+1).padStart(2,'0')}/${String(e.getDate()).padStart(2,'0')}`}if(m==='month'){s=new Date(a.getFullYear(),a.getMonth(),1);e=new Date(a.getFullYear(),a.getMonth()+1,0);label=`${a.getFullYear()}年${a.getMonth()+1}月`}if(m==='year'){s=new Date(a.getFullYear(),0,1);e=new Date(a.getFullYear(),11,31);label=`${a.getFullYear()}年`}return{s,e,label,sub}}
function shift(a,m,dir){let x=new Date(a);if(m==='day')x.setDate(x.getDate()+dir);if(m==='week')x.setDate(x.getDate()+7*dir);if(m==='month')x.setMonth(x.getMonth()+dir);if(m==='year')x.setFullYear(x.getFullYear()+dir);return x}
function overlap(e,b){return D(e.start)<=b.e&&D(e.end)>=b.s}function selected(b){return DATA.filter(e=>overlap(e,b))}

function trendData(){let a=[];if(mode==='week'){let base=monday(anchor);for(let i=-2;i<=2;i++){let s=add(base,i*7),e=add(s,6);a.push({label:`第${Math.floor((s-monday(new Date(s.getFullYear(),0,4)))/604800000)+1}周`,value:selected({s,e}).filter(x=>x.display_status!=='取消').length,active:i===0})}}else if(mode==='month'){for(let i=-2;i<=2;i++){let d=new Date(anchor.getFullYear(),anchor.getMonth()+i,1),b=bounds(d,'month');a.push({label:`${d.getMonth()+1}月`,value:selected(b).filter(x=>x.display_status!=='取消').length,active:i===0})}}else if(mode==='year'){for(let i=-2;i<=2;i++){let d=new Date(anchor.getFullYear()+i,0,1),b=bounds(d,'year');a.push({label:String(d.getFullYear()),value:selected(b).filter(x=>x.display_status!=='取消').length,active:i===0})}}else{for(let i=-3;i<=3;i++){let d=add(anchor,i),b=bounds(d,'day');a.push({label:`${d.getMonth()+1}/${d.getDate()}`,value:selected(b).filter(x=>x.display_status!=='取消').length,active:i===0})}}return a}
function renderTrend(){let data=trendData(),W=600,H=145,pad=36,max=Math.max(1,...data.map(x=>x.value)),plotW=W-pad*2,plotH=82,pts=data.map((x,i)=>[pad+i*plotW/(data.length-1),24+plotH-x.value/max*plotH]);let area=`M${pts[0][0]},${24+plotH}L${pts.map(p=>`${p[0]},${p[1]}`).join('L')}L${pts[pts.length-1][0]},${24+plotH}Z`;trendEl.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3,4].map(i=>{let y=24+i*plotH/4;return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#e8eef7"/>`}).join('')}<path d="${area}" fill="url(#tg)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${data[i].active?6:4.5}" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">${data[i].value}</text><text x="${p[0]}" y="${H-10}" text-anchor="middle" font-size="10" fill="${data[i].active?'#2563eb':'#64748b'}" font-weight="${data[i].active?700:400}">${data[i].label}</text>`).join('')}</svg>`}
function renderGantt(arr,b,calRange){let list=arr.filter(e=>e.display_status!=='取消').sort((a,b)=>D(a.start)-D(b.start));if(!list.length){ganttBodyEl.innerHTML='<tr><td colspan="7" style="text-align:center;color:#718198;padding:28px">当前周期暂无展会</td></tr>';return}let gs=calRange?.start||b.s, ge=calRange?.end||b.e;let span=Math.max(1,(ge-gs)/86400000);ganttBodyEl.innerHTML=list.map(e=>{let s=Math.max(0,(D(e.start)-gs)/86400000/span*100),en=Math.min(100,(D(e.end)-gs)/86400000/span*100),w=Math.max(2,en-s+1.5),cls=e.display_status==='筹备中'?'prep':e.display_status==='进行中'?'run':'done',today=(NOW-gs)/86400000/span*100,tline=(today>=0&&today<=100)?`<i class="today" style="left:${today}%"></i>`:'';return `<tr><td>${e.name}</td><td>${e.place||'—'}</td><td>${e.display_status}</td><td class="date">${e.start}</td><td class="date">${e.end}</td><td>${e.duration}天</td><td class="tcell"><div class="timeline">${tline}<span class="bar ${cls}" style="left:${s}%;width:${w}%">${e.display_status}</span></div></td></tr>`}).join('')}

function renderCalendar(b){
  // Detailed calendar header for the gantt timeline:
  // week -> selected week + following week (14 days, the confirmed standard);
  // day -> the single day; month -> all days of the month; year -> 12 month blocks.
  let start=b.s, end=b.e;
  if(mode==='week'){ end=add(b.s,13); }
  const span=Math.max(1,Math.round((end-start)/86400000)+1);
  let cells=[];
  if(mode==='year'){
    for(let m=0;m<12;m++){cells.push(`<div class="calDay"><b>${m+1}月</b><span>${start.getFullYear()}</span></div>`)}
  }else{
    for(let i=0;i<span;i++){
      let d=add(start,i);
      let wd=['日','一','二','三','四','五','六'][d.getDay()];
      let isToday=d.toDateString()===NOW.toDateString();
      cells.push(`<div class="calDay ${isToday?'calToday':''}"><b>${d.getMonth()+1}/${d.getDate()}</b><span>周${wd}</span></div>`);
    }
  }
  const n=mode==='year'?12:span;
  calendarHeaderEl.innerHTML=`<div class="calendar" style="grid-template-columns:repeat(${n},1fr);min-width:${Math.max(600,n*42+8)}px">${cells.join('')}</div>`;

  // grouped month/week line above the day columns
  let jan4=new Date(start.getFullYear(),0,4);
  let weekNo=Math.floor((start-monday(jan4))/604800000)+1;
  let label;
  if(mode==='year'){label=`${start.getFullYear()}年`}
  else if(mode==='month'){label=`${start.getFullYear()}年${start.getMonth()+1}月`}
  else if(mode==='day'){label=`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`}
  else{label=`${start.getFullYear()}年${start.getMonth()+1}月（第${weekNo}周）　${String(start.getMonth()+1).padStart(2,'0')}/${String(start.getDate()).padStart(2,'0')} - ${String(b.e.getMonth()+1).padStart(2,'0')}/${String(b.e.getDate()).padStart(2,'0')}`}
  calendarMonthHeaderEl.textContent=label;

  return {start,end};
}

function render(){let b=bounds(anchor,mode),arr=selected(b),prev=selected(bounds(shift(anchor,mode,-1),mode)),c=sc(arr),pc=sc(prev),total=arr.filter(x=>x.display_status!=='取消').length,pt=prev.filter(x=>x.display_status!=='取消').length;periodLabelEl.textContent=b.label;periodSubEl.textContent=b.sub;ganttPeriodTextEl.textContent=b.label+(b.sub?'　'+b.sub:'');kTotalEl.textContent=total;kRunEl.textContent=c['进行中']||0;kPrepEl.textContent=c['筹备中']||0;kDoneEl.textContent=c['已完成']||0;delta('dTotal',total,pt);delta('dRun',c['进行中']||0,pc['进行中']||0);delta('dPrep',c['筹备中']||0,pc['筹备中']||0);delta('dDone',c['已完成']||0,pc['已完成']||0);let live=arr.filter(x=>x.display_status!=='取消'),den=Math.max(1,live.length),run=c['进行中']||0,prep=c['筹备中']||0,done=c['已完成']||0,a=run/den*100,bp=(run+prep)/den*100,bd=(run+prep+done)/den*100;statusRingEl.style.background=`conic-gradient(#2563eb 0 ${a}%,#f59e0b ${a}% ${bp}%,#10b981 ${bp}% ${bd}%,#edf2f7 ${bd}% 100%)`;ringTotalEl.textContent=live.length;statusLegendEl.innerHTML=`<div><span><i class="dot" style="background:#2563eb"></i>进行中</span><b>${run}</b></div><div><span><i class="dot" style="background:#f59e0b"></i>筹备中</span><b>${prep}</b></div><div><span><i class="dot" style="background:#10b981"></i>已完成</span><b>${done}</b></div>`;let p={};live.forEach(e=>e.products.forEach(x=>p[x]=(p[x]||0)+1));productsEl.innerHTML=bars(Object.entries(p).sort((a,b)=>b[1]-a[1]));let cal=renderCalendar(b);
renderTrend();
// 进度安排与顶部 KPI 使用同一筛选口径：
let ganttArr=arr;
renderGantt(ganttArr,b,cal)}
document.querySelectorAll('#modeBtns button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#modeBtns button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');mode=btn.dataset.mode;render()});prevBtn.onclick=()=>{anchor=shift(anchor,mode,-1);render()};nextBtn.onclick=()=>{anchor=shift(anchor,mode,1);render()};render();
</script>
</body></html>
