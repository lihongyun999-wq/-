<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery 项目看板</title>
<style>
:root{
  --blue:#2563eb;--ink:#10233f;--muted:#64748b;--line:#dce7f2;
  --nav1:#0c1e42;--nav2:#16356f;--bg:#eef4fb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
.shell{display:flex;width:100vw;height:100vh}
.sidebar{width:190px;flex:0 0 190px;height:100vh;background:linear-gradient(180deg,var(--nav1),#122c5e 55%,var(--nav2));
  box-shadow:4px 0 20px rgba(12,30,66,.14);display:flex;flex-direction:column;z-index:10}
.brand{height:76px;display:flex;align-items:center;padding:0 20px;color:#fff;font-size:23px;font-weight:800;letter-spacing:.2px}
.nav{padding:8px 12px;display:grid;gap:5px}
.nav button{height:48px;border:0;border-radius:10px;background:transparent;color:#b7c8e8;text-align:left;padding:0 14px;
  font-size:14px;cursor:pointer;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:linear-gradient(90deg,#2563eb,#3f7bf6);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.42)}
.version{margin-top:auto;padding:18px 20px 22px;color:#8fa6cc;font-size:10.5px;line-height:1.8}
.content{flex:1;min-width:0;height:100vh;background:#eef4fb}
.frame{display:none;width:100%;height:100%;border:0;background:#eef4fb}
.frame.active{display:block}
@media(max-width:900px){
  .sidebar{width:142px;flex-basis:142px}
  .brand{font-size:19px;padding:0 13px}
  .nav{padding:6px}
  .nav button{font-size:12px;padding:0 10px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Delivery</div>
    <div class="nav">
      <button class="active" data-target="delivery">▣ 交付项目</button>
      <button data-target="expo">▣ 展会项目</button>
      <button data-target="industry">◆ 行业孵化</button>
    </div>
    <div class="version">
      三看板整合版<br>
      交付 V1.3.3<br>
      展会 V1.4.4<br>
      行业孵化 V1.2
    </div>
  </aside>

  <main class="content">
    <iframe id="delivery" class="frame active" src="pages/delivery.html" title="交付项目看板"></iframe>
    <iframe id="expo" class="frame" src="pages/expo.html" title="展会项目看板"></iframe>
    <iframe id="industry" class="frame" src="pages/industry.html" title="行业孵化项目看板"></iframe>
  </main>
</div>
<script>
const buttons=[...document.querySelectorAll('.nav button')];
const frames=[...document.querySelectorAll('.frame')];

function openPage(id){
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.target===id));
  frames.forEach(f=>f.classList.toggle('active',f.id===id));
  history.replaceState(null,'','#'+id);
}
buttons.forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.target)));

const initial=location.hash.slice(1);
if(['delivery','expo','industry'].includes(initial)) openPage(initial);
</script>
</body>
</html>
